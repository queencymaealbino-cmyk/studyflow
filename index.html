<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5B6FE8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>StudyFlow — Your personal study planner</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <main id="app" aria-live="polite">
      <section class="screen" id="homeScreen" aria-labelledby="homeTitle"></section>
      <section class="screen" id="calendarScreen" aria-labelledby="calendarTitle" hidden></section>
      <section class="screen" id="tasksScreen" aria-labelledby="tasksTitle" hidden></section>
      <section class="screen" id="formScreen" aria-labelledby="formTitle" hidden></section>
      <section class="screen" id="detailsScreen" aria-labelledby="detailsTitle" hidden></section>
      <section class="screen" id="profileScreen" aria-labelledby="profileTitle" hidden></section>
      <section class="screen" id="setupScreen" aria-labelledby="setupTitle" hidden></section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <button class="install-app" id="installApp" type="button" hidden>Install StudyFlow</button>
      <div class="modal-layer" id="modalLayer" hidden></div>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
      <button type="button" data-nav="home" aria-label="Home"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3.5 10 8.5-7 8.5 7v10a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 20z"/><path d="M9 21v-8h6v8"/></svg></span><span>Home</span></button>
      <button type="button" data-nav="calendar" aria-label="Calendar"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17"/></svg></span><span>Calendar</span></button>
      <button type="button" data-nav="tasks" aria-label="Tasks"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11"/><path d="m8 12 3 3L21 4"/></svg></span><span>Tasks</span></button>
      <button type="button" data-nav="profile" aria-label="Profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg></span><span>Profile</span></button>
    </nav>
  </div>
</body>
</html>
